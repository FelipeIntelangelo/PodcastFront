<div class="category-podcasts-container">
  <header class="page-header">
    <h1>Explorar: {{ category }}</h1>
  </header>

  @if (isLoading) {
    <div class="loading-container">
      <p>Cargando podcasts...</p>
    </div>
  } @else if (podcasts.length === 0) {
    <div class="empty-state">
      <p>No se encontraron podcasts en esta categoría.</p>
    </div>
  } @else {
    <div class="podcasts-list">
      @for (p of podcasts; track p.id) {
        <article class="podcast-card" (click)="viewPodcast(p.id)">
          <div class="podcast-image">
            @if (p.imageUrl) {
              <img [src]="p.imageUrl" [alt]="p.title">
            } @else {
              <div class="image-placeholder"><span class="icon-podcast-placeholder"></span></div>
            }
          </div>
          <div class="podcast-content">
            <h3 class="podcast-title">{{ p.title }}</h3>
            <p class="podcast-description">{{ p.description }}</p>
          </div>
        </article>
      }
    </div>
  }
</div>
